# Independent read-only follow-up of synthetic-ci main push. No new schedule,
# credentials, write permissions, mutable authority or production changes.
name: phase1-postmerge-external-readback
on:
  workflow_run:
    workflows: [synthetic-ci]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  verify-main-ci:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'THECHANJONG/project002-synthetic-pr-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted exact main push code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Independent GitHub API readback of exact completed run
        env:
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m scripts.verify_postmerge_external
